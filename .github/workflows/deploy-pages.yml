name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'        # vite base = /Thela-Dhaka/
          VITE_STATIC_HOST: 'true'    # no game server on Pages → solo only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # One-off: clears the stuck deployment from the old "Deploy from a branch" setup.
      # Safe to delete this step once the site is live.
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/be28e48ad7b78d4b1ed106240097ab9bbb3ddbe6/cancel" || true
          sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
